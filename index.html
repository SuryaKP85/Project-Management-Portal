<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=/PM-Portal/index.html" />
    <title>Enterprise Project Management Portal</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        background-color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #0f172a;
      }
      .redirect-box {
        text-align: center;
        padding: 32px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
        border: 1px solid #e2e8f0;
        max-width: 400px;
      }
      h2 {
        font-size: 1.25rem;
        font-weight: 700;
        margin-bottom: 8px;
        color: #1e293b;
      }
      p {
        font-size: 0.875rem;
        color: #475569;
        margin-bottom: 20px;
        line-height: 1.5;
      }
      a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="redirect-box">
      <h2>Enterprise PM Portal</h2>
      <p>Redirecting you to the workspace...</p>
      <p>If you are not redirected automatically, please <a href="/PM-Portal/index.html">click here to open the Portal</a>.</p>
    </div>
  </body>
</html>
