<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password - Enterprise Project Management Portal</title>
  
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/styles.css" />
  
  <style>
    body {
      background-color: var(--bg-main, #f8fafc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .auth-card {
      background-color: var(--bg-card, #ffffff);
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: 16px;
      padding: 40px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .policy-item {
      font-size: 0.775rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .policy-item.valid {
      color: #10b981;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-primary-subtle text-primary mb-3" style="width: 60px; height: 60px;">
        <i class="fa-solid fa-lock-open fa-2x"></i>
      </div>
      <h2 class="font-bold text-primary mb-1" style="font-size: 1.5rem;">Update Password</h2>
      <p id="force-change-subtitle" class="text-muted" style="font-size: 0.875rem;">Set a secure password for your portal account</p>
    </div>

    <!-- Alert Box -->
    <div id="change-alert" class="alert d-none py-2 px-3 font-semibold mb-3" style="font-size: 0.85rem;"></div>

    <form id="change-password-form">
      <div class="mb-3" id="old-password-group">
        <label for="old-password" class="form-label font-semibold">Current / Temporary Password</label>
        <input type="password" id="old-password" class="form-control select-enterprise" placeholder="••••••••" required />
      </div>

      <div class="mb-3">
        <label for="new-password" class="form-label font-semibold">New Password</label>
        <input type="password" id="new-password" class="form-control select-enterprise" placeholder="••••••••" required />
      </div>

      <div class="mb-3">
        <label for="confirm-password" class="form-label font-semibold">Confirm New Password</label>
        <input type="password" id="confirm-password" class="form-control select-enterprise" placeholder="••••••••" required />
      </div>

      <!-- Password Policy Checklist -->
      <div class="p-3 bg-light rounded border mb-4">
        <div class="font-semibold text-dark mb-2" style="font-size: 0.8rem;">Enterprise Password Requirements:</div>
        <div class="d-flex flex-column gap-1">
          <div class="policy-item" id="req-len"><i class="fa-regular fa-circle"></i> Minimum 8 characters</div>
          <div class="policy-item" id="req-upper"><i class="fa-regular fa-circle"></i> At least 1 uppercase letter (A-Z)</div>
          <div class="policy-item" id="req-lower"><i class="fa-regular fa-circle"></i> At least 1 lowercase letter (a-z)</div>
          <div class="policy-item" id="req-num"><i class="fa-regular fa-circle"></i> At least 1 number (0-9)</div>
          <div class="policy-item" id="req-spec"><i class="fa-regular fa-circle"></i> At least 1 special character (@$!%*?&)</div>
        </div>
      </div>

      <button type="submit" class="btn-enterprise btn-enterprise-primary w-100 py-2.5 font-bold mb-3 d-flex justify-content-center align-items-center gap-2">
        <i class="fa-solid fa-floppy-disk"></i> Save New Password
      </button>

      <div class="text-center" id="cancel-link-container">
        <a href="index.html" class="text-secondary text-decoration-none font-semibold" style="font-size: 0.85rem;">
          <i class="fa-solid fa-xmark me-1"></i> Cancel
        </a>
      </div>
    </form>
  </div>

  <script type="module">
    import { Authentication } from './js/authentication.js';

    document.addEventListener('DOMContentLoaded', () => {
      const user = Authentication.getCurrentUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      const subtitle = document.getElementById('force-change-subtitle');
      const cancelLink = document.getElementById('cancel-link-container');

      if (user.mustChangePassword) {
        subtitle.innerHTML = `<span class="text-danger font-semibold"><i class="fa-solid fa-triangle-exclamation me-1"></i> Password update required for first login</span>`;
        if (cancelLink) cancelLink.style.display = 'none';
      }

      const newPassInp = document.getElementById('new-password');
      const confirmPassInp = document.getElementById('confirm-password');

      // Live policy validation
      const checkPolicy = () => {
        const val = newPassInp.value;
        const updateReq = (id, valid) => {
          const el = document.getElementById(id);
          if (!el) return;
          if (valid) {
            el.className = 'policy-item valid';
            el.innerHTML = '<i class="fa-solid fa-circle-check"></i> ' + el.textContent.trim();
          } else {
            el.className = 'policy-item';
            el.innerHTML = '<i class="fa-regular fa-circle"></i> ' + el.textContent.replace('✔', '').trim();
          }
        };

        updateReq('req-len', val.length >= 8);
        updateReq('req-upper', /[A-Z]/.test(val));
        updateReq('req-lower', /[a-z]/.test(val));
        updateReq('req-num', /[0-9]/.test(val));
        updateReq('req-spec', /[@$!%*?&#^()_+\-=\[\]{};':"\\|,.<>\/?]/.test(val));
      };

      newPassInp.addEventListener('input', checkPolicy);

      // Handle Submit
      const form = document.getElementById('change-password-form');
      const alertBox = document.getElementById('change-alert');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        alertBox.className = 'alert d-none py-2 px-3 font-semibold mb-3';

        const oldPass = document.getElementById('old-password').value;
        const newPass = newPassInp.value;
        const confirmPass = confirmPassInp.value;

        if (newPass !== confirmPass) {
          alertBox.className = 'alert alert-danger py-2 px-3 font-semibold mb-3';
          alertBox.textContent = 'New password and confirmation password do not match.';
          return;
        }

        const res = Authentication.changePassword(user.id, oldPass, newPass);

        if (!res.success) {
          alertBox.className = 'alert alert-danger py-2 px-3 font-semibold mb-3';
          alertBox.textContent = res.message;
          return;
        }

        alertBox.className = 'alert alert-success py-2 px-3 font-semibold mb-3';
        alertBox.textContent = 'Password changed successfully! Redirecting to dashboard...';

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1200);
      });
    });
  </script>
</body>
</html>
