<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - Enterprise Project Management Portal</title>
  
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/styles.css" />
  
  <style>
    body {
      background-color: var(--bg-main, #f8fafc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .auth-card {
      background-color: var(--bg-card, #ffffff);
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: 16px;
      padding: 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-warning-subtle text-warning mb-3" style="width: 60px; height: 60px;">
        <i class="fa-solid fa-key fa-2x"></i>
      </div>
      <h2 class="font-bold text-primary mb-1" style="font-size: 1.5rem;">Reset Password</h2>
      <p class="text-muted" style="font-size: 0.875rem;">Enter your email to receive temporary login credentials</p>
    </div>

    <!-- Alert Box -->
    <div id="reset-alert" class="alert d-none py-2 px-3 font-semibold mb-3" style="font-size: 0.85rem;"></div>

    <form id="forgot-form">
      <div class="mb-4">
        <label for="reset-email" class="form-label font-semibold">Registered Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" id="reset-email" class="form-control select-enterprise border-start-0" placeholder="admin@company.com" required />
        </div>
      </div>

      <button type="submit" class="btn-enterprise btn-enterprise-primary w-100 py-2.5 font-bold mb-3 d-flex justify-content-center align-items-center gap-2">
        <i class="fa-solid fa-paper-plane"></i> Send Password Reset Instructions
      </button>

      <div class="text-center">
        <a href="login.html" class="text-secondary text-decoration-none font-semibold" style="font-size: 0.85rem;">
          <i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In
        </a>
      </div>
    </form>
  </div>

  <script type="module">
    import { Authentication } from './js/authentication.js';

    document.addEventListener('DOMContentLoaded', () => {
      Authentication.init();

      const form = document.getElementById('forgot-form');
      const alertBox = document.getElementById('reset-alert');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        alertBox.className = 'alert d-none py-2 px-3 font-semibold mb-3';

        const email = document.getElementById('reset-email').value;
        const result = Authentication.resetPassword(email, 'iRely@123');

        if (result.success) {
          alertBox.className = 'alert alert-success py-2 px-3 font-semibold mb-3';
          alertBox.innerHTML = `<i class="fa-solid fa-circle-check me-1"></i> ${result.message}. You can now log in using temporary password <strong>${result.tempPassword}</strong>.`;
        } else {
          alertBox.className = 'alert alert-danger py-2 px-3 font-semibold mb-3';
          alertBox.textContent = result.message;
        }
      });
    });
  </script>
</body>
</html>
