<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile - Enterprise Project Management Portal</title>
  
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/tables.css" />
  
  <style>
    body {
      background-color: var(--bg-main, #f8fafc);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .profile-dropzone {
      border: 2px dashed var(--border-color, #cbd5e1);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .profile-dropzone:hover {
      border-color: var(--brand-primary, #4f46e5);
      background-color: rgba(79, 70, 229, 0.03);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header style="background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 12px 24px;">
    <div class="d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="btn btn-sm btn-light border font-semibold d-flex align-items-center gap-2">
          <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
        <h3 class="m-0 font-bold text-primary" style="font-size: 1.2rem;">My Enterprise Profile</h3>
      </div>
      <div class="d-flex align-items-center gap-3">
        <a href="change-password.html" class="btn btn-sm btn-outline-primary font-semibold">
          <i class="fa-solid fa-key me-1"></i> Change Password
        </a>
        <button id="profile-logout-btn" class="btn btn-sm btn-outline-danger font-semibold">
          <i class="fa-solid fa-right-from-bracket me-1"></i> Sign Out
        </button>
      </div>
    </div>
  </header>

  <main class="container py-4" style="max-width: 900px;">
    <div class="row g-4">
      
      <!-- Left Column: Avatar & Photo Drag and Drop -->
      <div class="col-md-4">
        <div class="enterprise-card h-100 p-4 text-center">
          <h5 class="font-bold text-primary mb-3">Profile Picture</h5>
          
          <div id="profile-avatar-preview" class="mb-3 d-flex justify-content-center">
            <!-- Dynamic Avatar Preview -->
          </div>

          <div class="profile-dropzone mb-3" id="profile-avatar-dropzone">
            <i class="fa-solid fa-cloud-arrow-up fa-2x text-primary mb-2"></i>
            <div class="font-semibold text-dark" style="font-size: 0.85rem;">Click or Drag & Drop photo</div>
            <small class="text-muted d-block" style="font-size: 0.75rem;">Supports PNG, JPG, WEBP (Max 5MB)</small>
            <input type="file" id="profile-avatar-file-input" accept="image/*" class="d-none" />
          </div>

          <button id="profile-avatar-remove-btn" type="button" class="btn btn-sm btn-outline-danger font-semibold w-100">
            <i class="fa-solid fa-trash me-1"></i> Remove Photo
          </button>
        </div>
      </div>

      <!-- Right Column: Personal Information Form -->
      <div class="col-md-8">
        <div class="enterprise-card p-4">
          <h5 class="font-bold text-primary mb-3"><i class="fa-solid fa-user-pen text-primary me-2"></i>Personal Details</h5>

          <form id="profile-form" class="row g-3">
            <div class="col-md-12">
              <label class="form-label font-semibold">Full Display Name *</label>
              <input type="text" id="profile-full-name" class="form-control select-enterprise" required />
            </div>

            <div class="col-md-12">
              <label class="form-label font-semibold">Email Address (Username)</label>
              <input type="email" id="profile-email" class="form-control select-enterprise" readonly style="background-color: var(--bg-light);" />
            </div>

            <div class="col-md-6">
              <label class="form-label font-semibold">Phone Number</label>
              <input type="text" id="profile-phone" class="form-control select-enterprise" placeholder="+1 (555) 000-0000" />
            </div>

            <div class="col-md-6">
              <label class="form-label font-semibold">Assigned Department</label>
              <select id="profile-dept" class="form-select select-enterprise">
                <option value="Dev">Dev</option>
                <option value="QA">QA</option>
                <option value="BA">BA</option>
                <option value="Product Manager">Product Manager</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label font-semibold">System Permission Level</label>
              <input type="text" id="profile-role" class="form-control select-enterprise" readonly style="background-color: var(--bg-light);" />
            </div>

            <div class="col-md-6">
              <label class="form-label font-semibold">Language Preference</label>
              <select id="profile-language" class="form-select select-enterprise">
                <option value="en">English (United States)</option>
                <option value="es">Spanish (Español)</option>
                <option value="fr">French (Français)</option>
                <option value="de">German (Deutsch)</option>
              </select>
            </div>

            <div class="col-md-12">
              <label class="form-label font-semibold">Timezone Settings</label>
              <select id="profile-timezone" class="form-select select-enterprise">
                <option value="UTC-05:00">UTC-05:00 (Eastern Time)</option>
                <option value="UTC-06:00">UTC-06:00 (Central Time)</option>
                <option value="UTC-08:00">UTC-08:00 (Pacific Time)</option>
                <option value="UTC+00:00">UTC+00:00 (Greenwich Mean Time)</option>
                <option value="UTC+05:30">UTC+05:30 (India Standard Time)</option>
              </select>
            </div>

            <div class="col-12 pt-3">
              <button type="submit" class="btn-enterprise btn-enterprise-primary w-100 py-2.5 font-bold">
                <i class="fa-solid fa-floppy-disk me-1"></i> Save Profile Preferences
              </button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </main>

  <!-- JS Dependencies -->
  <script type="module">
    import { Authentication } from './js/authentication.js';
    import { ProfileModule } from './js/profile.js';

    document.addEventListener('DOMContentLoaded', () => {
      const user = Authentication.requireAuth();
      if (!user) return;

      ProfileModule.init(window.portalAppInstance || { showToast: alert });

      const logoutBtn = document.getElementById('profile-logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          Authentication.logout();
        });
      }
    });
  </script>
</body>
</html>
